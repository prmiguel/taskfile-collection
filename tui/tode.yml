# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  install:
    desc: Install tode terminal editor (tode, non-root)
    summary: |
      tode is a terminal-based editor (binary: tode). The official installer
      downloads the release tarball into ~/.local/lib/tode and copies the
      launcher into ~/.local/bin, all owned by the current user (override with
      TODE_INSTALL_ROOT and XDG_BIN_HOME). No sudo is used. On Linux its
      bundled Electron runtime needs the usual Chromium libraries (libnss3,
      libgtk-3-0, libgbm1, ...).
    cmds:
      - cmd: curl -fsSL https://tode.sh/install | bash
        platforms: [linux, darwin]
    preconditions:
      - sh: command -v curl
        msg: "curl is required to install tode."
    silent: true
