# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  install:
    vars:
      METADATA_CATEGORY: [cli, ai-tool]
    desc: Install rtk (Rust Token Killer, non-root)
    summary: |
      rtk is a CLI proxy that cuts LLM token consumption on common dev
      commands. Installs into user-owned locations without sudo: the official
      script writes to ~/.local/bin on Linux (override with RTK_INSTALL_DIR),
      Homebrew's user-owned prefix on macOS, and %USERPROFILE%\.local\bin on
      Windows. After installing, the task runs 'rtk --version' to confirm the
      binary works. Enable the Claude Code hook with 'task rtk:init'.
    cmds:
      - cmd: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/master/install.sh | RTK_INSTALL_DIR="${RTK_INSTALL_DIR:-$HOME/.local/bin}" sh
        platforms: [linux]
      - cmd: '"${RTK_INSTALL_DIR:-$HOME/.local/bin}/rtk" --version'
        platforms: [linux]
      - cmd: brew install rtk-ai/tap/rtk
        platforms: [darwin]
      - cmd: '"$(brew --prefix)/bin/rtk" --version'
        platforms: [darwin]
      - cmd: |
          powershell -ep Bypass -c "$ProgressPreference='SilentlyContinue'; Invoke-WebRequest -Uri https://github.com/rtk-ai/rtk/releases/latest/download/rtk-x86_64-pc-windows-msvc.zip -OutFile $env:TEMP\rtk.zip; Expand-Archive $env:TEMP\rtk.zip -DestinationPath $env:USERPROFILE\.local\bin -Force"
        platforms: [windows]
      - cmd: |
          powershell -ep Bypass -c "$rtk = Join-Path $env:USERPROFILE '.local\bin\rtk.exe'; if (-not (Test-Path $rtk)) { throw ('rtk not found at ' + $rtk) }; & $rtk --version"
        platforms: [windows]
    preconditions:
      - sh: command -v curl
        msg: "curl is required to install rtk."
    silent: true

  install-cargo:
    vars:
      METADATA_CATEGORY: [cli, ai-tool]
    desc: Install rtk from source via cargo (non-root)
    summary: |
      Builds rtk from the Git URL so the correct crate is installed, avoiding
      the name collision with the unrelated 'rtk' crate (Rust Type Kit).
      Cargo writes the binary to the user-owned ~/.cargo/bin, so no sudo is
      needed, and the task runs 'rtk --version' to confirm it works.
    cmds:
      - cmd: cargo install --git https://github.com/rtk-ai/rtk rtk
        platforms: [linux, darwin]
      - cmd: '"${CARGO_HOME:-$HOME/.cargo}/bin/rtk" --version'
        platforms: [linux, darwin]
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    silent: true

  init:
    vars:
      METADATA_CATEGORY: [cli, ai-tool]
    desc: Enable the rtk hook for Claude Code
    summary: |
      Patches the global Claude Code settings to route through the rtk token
      proxy and generates the RTK.md context file.
    cmds:
      - cmd: rtk init --global
        platforms: [linux, darwin, windows]
    preconditions:
      - sh: command -v rtk
        msg: "rtk not found — run 'task rtk:install' first."
    silent: true
