# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

# System & CLI utilities: monitoring, file/search/navigation, archives,
# backup/sync, shell/terminal extras, clipboard, notifications and version
# managers. Non-root where possible; system packages use the platform manager.
tasks:
  # --- Monitoring & system info ---
  bottom:
    vars:
      METADATA_CATEGORY: [tui, monitoring]
    desc: Cross-platform process/system monitor (btm)
    cmds:
      - cmd: cargo install bottom --locked
        platforms: [linux]
      - cmd: brew install bottom
        platforms: [darwin]
    preconditions:
      - sh: command -v cargo || command -v brew
        msg: "Rust/cargo is required (or use brew on macOS)."
    silent: true

  zenith:
    vars:
      METADATA_CATEGORY: [tui, monitoring]
    desc: Zoomable CPU/memory/disk monitor
    cmds:
      - cargo install zenith
    preconditions:
      - sh: command -v cargo
        msg: "Rust/cargo is required."
    silent: true

  gtop:
    vars:
      METADATA_CATEGORY: [tui, monitoring]
    desc: System monitoring dashboard (Node)
    cmds:
      - npm install -g gtop
    preconditions:
      - sh: command -v npm
        msg: "Node.js and npm are required. Run 'task node:install-22' first."
    silent: true

  vtop:
    vars:
      METADATA_CATEGORY: [tui, monitoring]
    desc: Terminal activity monitor
    cmds:
      - npm install -g vtop
    preconditions:
      - sh: command -v npm
        msg: "Node.js and npm are required. Run 'task node:install-22' first."
    silent: true

  s-tui:
    vars:
      METADATA_CATEGORY: [tui, monitoring]
    desc: CPU stress test and monitor
    cmds:
      - pip3 install --user s-tui
    preconditions:
      - sh: command -v pip3
        msg: "pip3 is required."
    silent: true

  nmon:
    vars:
      METADATA_CATEGORY: [cli, monitoring]
    desc: System performance monitor
    cmds:
      - cmd: sudo apt install -y nmon
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm nmon
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install nmon
        platforms: [darwin]
    silent: true

  tiptop:
    vars:
      METADATA_CATEGORY: [tui, monitoring]
    desc: System monitor
    cmds:
      - pip3 install --user tiptop
    preconditions:
      - sh: command -v pip3
        msg: "pip3 is required."
    silent: true

  fastfetch:
    vars:
      METADATA_CATEGORY: [cli, monitoring]
    desc: Fast system information tool
    cmds:
      - cmd: sudo apt install -y fastfetch
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm fastfetch
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install fastfetch
        platforms: [darwin]
      - cmd: winget install -e --id Fastfetch-cli.Fastfetch
        platforms: [windows]
    silent: true

  macchina:
    vars:
      METADATA_CATEGORY: [cli, monitoring]
    desc: System info with themes
    cmds:
      - cmd: cargo install macchina
        platforms: [linux]
      - cmd: brew install macchina
        platforms: [darwin]
    preconditions:
      - sh: command -v cargo || command -v brew
        msg: "Rust/cargo is required (or use brew on macOS)."
    silent: true

  cpufetch:
