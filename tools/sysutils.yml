      - cmd: sudo pacman -S --noconfirm nethogs
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install nethogs
        platforms: [darwin]
    silent: true

  iftop:
    vars:
      METADATA_CATEGORY: [cli, monitoring, network]
    desc: Bandwidth by connection
    cmds:
      - cmd: sudo apt install -y iftop
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm iftop
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install iftop
        platforms: [darwin]
    silent: true

  nload:
    vars:
      METADATA_CATEGORY: [cli, monitoring, network]
    desc: Live network load
    cmds:
      - cmd: sudo apt install -y nload
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm nload
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install nload
        platforms: [darwin]
    silent: true

  vnstat:
