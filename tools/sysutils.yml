        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm brotli
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install brotli
        platforms: [darwin]
    silent: true

  unrar:
    vars:
      METADATA_CATEGORY: [cli, archive]
    desc: RAR extraction
    cmds:
      - cmd: sudo apt install -y unrar
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm unrar
        platforms: [linux]
        if: test -f /etc/arch-release
