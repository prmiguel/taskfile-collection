  # --- Disk, backup & sync ---
  restic:
    vars:
      METADATA_CATEGORY: [cli, backup]
    desc: Encrypted, deduplicated backups
    cmds:
      - cmd: sudo apt install -y restic
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm restic
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install restic
        platforms: [darwin]
      - cmd: winget install -e --id restic.restic
        platforms: [windows]
    silent: true

  borgbackup:
    vars:
      METADATA_CATEGORY: [cli, backup]
    desc: Deduplicating backup (borg)
    cmds:
      - pip3 install --user borgbackup
    preconditions:
      - sh: command -v pip3
        msg: "pip3 is required."
    silent: true

  kopia:
    vars:
      METADATA_CATEGORY: [cli, backup]
    desc: Fast encrypted snapshot backups
    cmds:
      - cmd: mkdir -p ~/.local/bin && curl -fsSL https://github.com/kopia/kopia/releases/latest/download/kopia-linux-x64.tar.gz | tar xz -C /tmp kopia && mv /tmp/kopia ~/.local/bin/ && chmod +x ~/.local/bin/kopia
        platforms: [linux]
      - cmd: brew install kopia
        platforms: [darwin]
      - cmd: winget install -e --id Kopia.KopiaCLI
        platforms: [windows]
    preconditions:
      - sh: command -v curl || command -v brew
        msg: "curl is required (or use brew on macOS)."
    silent: true

  duplicity:
    vars:
      METADATA_CATEGORY: [cli, backup]
    desc: Encrypted bandwidth-efficient backup
    cmds:
      - cmd: sudo apt install -y duplicity
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: brew install duplicity
        platforms: [darwin]
    silent: true

  rsync:
    vars:
      METADATA_CATEGORY: [cli, backup]
