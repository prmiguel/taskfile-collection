      METADATA_CATEGORY: [cli, monitoring]
    desc: CPU architecture info
    cmds:
      - cmd: sudo apt install -y cpufetch
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm cpufetch
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install cpufetch
        platforms: [darwin]
    silent: true

  bandwhich:
    vars:
      METADATA_CATEGORY: [cli, monitoring, network]
    desc: Per-process bandwidth monitor
    cmds:
      - cmd: cargo install bandwhich
        platforms: [linux]
      - cmd: brew install bandwhich
        platforms: [darwin]
    preconditions:
