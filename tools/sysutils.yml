    cmds:
      - cmd: sudo apt install -y vnstat
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm vnstat
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install vnstat
        platforms: [darwin]
    silent: true

  iotop:
    vars:
      METADATA_CATEGORY: [cli, monitoring]
    desc: Per-process disk I/O monitor
    cmds:
      - cmd: sudo apt install -y iotop
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm iotop
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install iotop
        platforms: [darwin]
    silent: true

  sysbench:
