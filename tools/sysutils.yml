      METADATA_CATEGORY: [cli, archive]
    desc: Universal archive extractor (The Unarchiver)
    cmds:
      - cmd: sudo apt install -y unar
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: brew install unar
        platforms: [darwin]
    silent: true

  atool:
    vars:
      METADATA_CATEGORY: [cli, archive]
    desc: Wrapper for many archive formats
    cmds:
      - cmd: sudo apt install -y atool
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: brew install atool
        platforms: [darwin]
