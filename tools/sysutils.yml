  # --- Archives & compression ---
  7zip:
    vars:
      METADATA_CATEGORY: [cli, archive]
    desc: 7-Zip archive tool
    cmds:
      - cmd: sudo apt install -y p7zip-full
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm p7zip
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install sevenzip
        platforms: [darwin]
      - cmd: winget install -e --id 7zip.7zip
        platforms: [windows]
    silent: true

  zstd:
    vars:
      METADATA_CATEGORY: [cli, compression]
    desc: Fast compression codec
    cmds:
      - cmd: sudo apt install -y zstd
        platforms: [linux]
