  pipes-sh:
    desc: Animated pipes terminal screensaver
    cmds:
      - cmd: sudo apt install -y pipes.sh
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: brew install pipes.sh
        platforms: [darwin]
    silent: true

  install-all:
    desc: Install the misc bundle (non-root where possible)
    cmds:
      - task: qrcode
      - task: gpg
      - task: aria2
      - task: s5cmd
      - task: localtunnel
      - task: gotty
      - task: goaccess
      - task: tailspin
      - task: newsboat
      - task: taskbook
      - task: ledger
      - task: calcurse
      - task: cmatrix
    silent: true
