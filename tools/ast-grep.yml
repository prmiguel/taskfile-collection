# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

# ast-grep: structural search, lint and rewrite
# https://github.com/ast-grep/ast-grep
# Installed via cargo (preferred), npm (@ast-grep/cli), or pip (ast-grep).
tasks:
  install:
    desc: Install ast-grep (sg)
    cmds:
      - cmd: cargo install ast-grep
        platforms: [linux, darwin, windows]
        if: command -v cargo
      - cmd: npm install -g @ast-grep/cli --allow-scripts=@ast-grep/cli
        platforms: [linux, darwin, windows]
        if: "! command -v cargo && command -v npm"
      - cmd: pip3 install --user ast-grep
        platforms: [linux, darwin, windows]
        if: "! command -v cargo && ! command -v npm && command -v pip3"
    preconditions:
      - sh: command -v cargo || command -v npm || command -v pip3
        msg: "Rust/cargo, Node.js/npm, or pip3 is required to install ast-grep."
    silent: true
