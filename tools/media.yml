  # --- Image generation (local & API) ---
  stable-diffusion-cpp:
    vars:
      METADATA_CATEGORY: [service, media, image-generation]
    desc: Stable Diffusion / Flux inference CLI (C/C++). Builds to ~/.local/bin
    cmds:
      - cmd: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/stable-diffusion.cpp
          cd /tmp/stable-diffusion.cpp && cmake -B build && cmake --build build --config Release -j
          cmake --install build --prefix ~/.local && rm -rf /tmp/stable-diffusion.cpp
        platforms: [linux, darwin]
    preconditions:
      - sh: command -v git && command -v cmake
        msg: "git and cmake are required."
    silent: true

  comfyui:
    vars:
      METADATA_CATEGORY: [service, media, image-generation]
    desc: ComfyUI node-based SD/Flux workflows (API server)
