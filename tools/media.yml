  # --- Speech: transcription & synthesis ---
  whisper-cpp:
    vars:
      METADATA_CATEGORY: [cli, media, speech]
    desc: Fast local Whisper (C/C++). Builds to ~/.local/bin
    cmds:
      - cmd: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cd /tmp/whisper.cpp && make -j
          cp main /tmp/whisper.cpp/build/bin/whisper-cli ~/.local/bin/ 2>/dev/null || cp main ~/.local/bin/
          rm -rf /tmp/whisper.cpp
        platforms: [linux, darwin]
    preconditions:
      - sh: command -v git && command -v make
        msg: "git and make are required."
    silent: true

  openai-whisper:
