# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

# Media & image tooling: conversion/optimization, image generation, audio,
# video, speech transcription/synthesis, and screen recording. Non-root where
# possible; system packages (ImageMagick, ffmpeg, yt-dlp via pip, etc.) use the
# platform manager.
tasks:
  # --- Image conversion & optimization ---
  imagemagick:
    vars:
      METADATA_CATEGORY: [cli, media, image]
    desc: ImageMagick image toolkit (magick)
    cmds:
      - cmd: sudo apt install -y imagemagick
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm imagemagick
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install imagemagick
        platforms: [darwin]
    silent: true

  graphicsmagick:
    vars:
      METADATA_CATEGORY: [cli, media, image]
    desc: GraphicsMagick image toolkit (gm)
    cmds:
      - cmd: sudo apt install -y graphicsmagick
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm graphicsmagick
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install graphicsmagick
        platforms: [darwin]
    silent: true

  libvips:
    vars:
      METADATA_CATEGORY: [library, media, image]
    desc: libvips image processing (vips)
    cmds:
      - cmd: sudo apt install -y libvips-tools
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm vips
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install vips
        platforms: [darwin]
    silent: true

  sharp-cli:
    vars:
      METADATA_CATEGORY: [cli, media, image]
    desc: Image resize/convert via sharp (libvips)
    cmds:
      - npm install -g sharp-cli
    preconditions:
      - sh: command -v npm
        msg: "Node.js and npm are required. Run 'task node:install-22' first."
    silent: true

  oxipng:
    vars:
      METADATA_CATEGORY: [cli, media, image]
    desc: PNG optimizer
    cmds:
      - cmd: cargo install oxipng
        platforms: [linux]
      - cmd: brew install oxipng
        platforms: [darwin]
    preconditions:
      - sh: command -v cargo || command -v brew
        msg: "Rust/cargo is required (or use brew on macOS)."
    silent: true

  optipng:
    vars:
      METADATA_CATEGORY: [cli, media, image]
    desc: Lossless PNG optimizer
    cmds:
      - cmd: sudo apt install -y optipng
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm optipng
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install optipng
        platforms: [darwin]
    silent: true

  pngquant:
