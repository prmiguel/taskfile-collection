# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

# Infrastructure-as-Code tools, installed to user space where possible.
tasks:
  terraform:
    desc: Terraform to ~/.local/bin
    cmds:
      - cmd: |
          mkdir -p ~/.local/bin
          VER=$(curl -fsSL https://checkpoint-api.hashicorp.com/v1/check/terraform | grep -oE '"current_version":"[^"]*"' | cut -d'"' -f4)
          curl -fsSL "https://releases.hashicorp.com/terraform/${VER}/terraform_${VER}_linux_amd64.zip" -o /tmp/tf.zip
          unzip -qo /tmp/tf.zip -d ~/.local/bin && rm /tmp/tf.zip
        platforms: [linux]
      - cmd: brew install terraform
        platforms: [darwin]
      - cmd: winget install -e --id HashiCorp.Terraform
        platforms: [windows]
    preconditions:
      - sh: command -v curl
        msg: curl and unzip are required.
    silent: true

  opentofu:
    desc: Open-source Terraform fork (via official install script)
    cmds:
      - curl -fsSL https://get.opentofu.org/install-opentofu.sh | sh -s -- --install-method standalone --install-dir ~/.local/bin
    preconditions:
      - sh: command -v curl
        msg: curl is required.
    silent: true

  terragrunt:
    desc: Terraform DRY wrapper (via go)
    cmds:
      - go install github.com/gruntwork-io/terragrunt@latest
    preconditions:
      - sh: command -v go
        msg: Go is required.
    silent: true

  terramate:
    desc: Terramate orchestration (via go)
    cmds:
      - go install github.com/terramate-io/terramate@latest
    preconditions:
      - sh: command -v go
        msg: Go is required.
    silent: true

  pulumi:
    desc: Pulumi IaC to ~/.pulumi
    cmds:
      - curl -fsSL https://get.pulumi.com | sh
    preconditions:
      - sh: command -v curl
        msg: curl is required.
    silent: true

  cdk:
    desc: AWS CDK (npm)
    cmds:
      - npm install -g aws-cdk
    preconditions:
      - sh: command -v npm
        msg: Node.js and npm are required.
    silent: true

  ansible:
    desc: Ansible config management
    cmds:
      - pip3 install --user ansible
    preconditions:
      - sh: command -v pip3
        msg: pip3 is required.
    silent: true

  ansible-lint:
    desc: Ansible playbook linter
    cmds:
      - pip3 install --user ansible-lint
    preconditions:
      - sh: command -v pip3
        msg: pip3 is required.
    silent: true

  packer:
    desc: HashiCorp Packer to ~/.local/bin
    cmds:
      - cmd: |
          mkdir -p ~/.local/bin
          VER=$(curl -fsSL https://checkpoint-api.hashicorp.com/v1/check/packer | grep -oE '"current_version":"[^"]*"' | cut -d'"' -f4)
          curl -fsSL "https://releases.hashicorp.com/packer/${VER}/packer_${VER}_linux_amd64.zip" -o /tmp/packer.zip
          unzip -qo /tmp/packer.zip -d ~/.local/bin && rm /tmp/packer.zip
        platforms: [linux]
      - cmd: brew install packer
        platforms: [darwin]
      - cmd: winget install -e --id HashiCorp.Packer
        platforms: [windows]
    preconditions:
      - sh: command -v curl
        msg: curl and unzip are required.
    silent: true

  infracost:
    desc: Cloud cost estimates (to ~/.local/bin)
    cmds:
      - cmd: mkdir -p ~/.local/bin && curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh -s -- -b ~/.local/bin
        platforms: [linux, darwin]
      - cmd: winget install -e --id Infracost.Infracost
        platforms: [windows]
    preconditions:
      - sh: command -v curl
        msg: curl is required.
    silent: true

  tflint:
    desc: Terraform linter (to ~/.local/bin)
    cmds:
      - cmd: mkdir -p ~/.local/bin && curl -fsSL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | TFLINT_INSTALL_PATH=~/.local/bin bash
        platforms: [linux]
      - cmd: brew install tflint
        platforms: [darwin]
      - cmd: winget install -e --id TerraformLinters.tflint
        platforms: [windows]
    preconditions:
      - sh: command -v curl
        msg: curl is required.
    silent: true

  tfsec:
    desc: Terraform security scanner (via go)
    cmds:
      - go install github.com/aquasecurity/tfsec/cmd/tfsec@latest
    preconditions:
      - sh: command -v go
        msg: Go is required.
    silent: true

  checkov:
    desc: IaC security scanner (pip)
    cmds:
      - pip3 install --user checkov
    preconditions:
      - sh: command -v pip3
        msg: pip3 is required.
    silent: true

  driftctl:
    desc: IaC drift detection (via go)
    cmds:
      - go install github.com/snyk/driftctl@latest
    preconditions:
      - sh: command -v go
        msg: Go is required.
    silent: true

  conftest:
    desc: Policy-as-code with OPA (via go)
    cmds:
      - go install github.com/open-policy-agent/conftest@latest
    preconditions:
      - sh: command -v go
        msg: Go is required.
    silent: true

  terraform-docs:
    desc: Docs from Terraform modules (via go)
    cmds:
      - go install github.com/terraform-docs/terraform-docs@latest
    preconditions:
      - sh: command -v go
        msg: Go is required.
    silent: true

  crossplane:
    desc: K8s control planes (via script)
    cmds:
      - curl -fsSL https://cli.crossplane.io | INSTALL_DIR=~/.local/bin sh
    preconditions:
      - sh: command -v curl
        msg: curl is required.
    silent: true

  vagrant:
    desc: VM environment manager (system package)
    cmds:
      - cmd: sudo apt install -y vagrant
        platforms: [linux]
        if: test -f /etc/debian_version
      - cmd: sudo pacman -S --noconfirm vagrant
        platforms: [linux]
        if: test -f /etc/arch-release
      - cmd: brew install --cask vagrant
        platforms: [darwin]
      - cmd: winget install -e --id Hashicorp.Vagrant
        platforms: [windows]
    silent: true

  install-all:
    desc: Install all IaC tools
    cmds:
      - task: terraform
      - task: opentofu
      - task: terragrunt
      - task: pulumi
      - task: cdk
      - task: ansible
      - task: packer
      - task: vagrant
      - task: infracost
      - task: tflint
      - task: tfsec
      - task: checkov
      - task: driftctl
      - task: conftest
      - task: terraform-docs
      - task: crossplane
    silent: true
