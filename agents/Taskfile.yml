# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  install-all:
    vars:
      METADATA_CATEGORY: [installer, agent]
    desc: Install all AI coding agents
    summary: |
      Installs every agent in this section sequentially into user-owned
      locations (no sudo): opencode, mimo, kilo, claude-code, cursor-agent,
      openclaude, command-code, pi, copilot, gentle-shell, the Antigravity
      CLI, Hermes Agent, Factory Droid, oh my pi (omp), and Junie. Sequential
      execution avoids concurrent npm global installs racing on the same npm
      prefix.
    cmds:
      - task: ':opencode:install'
      - task: ':mimocode:install'
      - task: ':kilo:install'
      - task: ':claude-code:install'
      - task: ':cursor-agent:install'
      - task: ':openclaude:install'
      - task: ':command-code:install'
      - task: ':pi:install'
      - task: ':copilot:install'
      - task: ':gentle-shell:install'
      - task: ':antigravity:install'
      - task: ':hermes:install'
      - task: ':droid:install'
      - task: ':omp:install'
      - task: ':junie:install'
    silent: true
