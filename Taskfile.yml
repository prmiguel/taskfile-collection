  opencode: ./agents/opencode.yml
  mimocode: ./agents/mimocode.yml
  kilo: ./agents/kilo.yml
  claude-code: ./agents/claude-code.yml
  cursor-agent: ./agents/cursor-agent.yml
  agents: ./agents
  rtk: ./ai-tools/rtk.yml
