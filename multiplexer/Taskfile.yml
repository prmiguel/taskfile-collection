# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  install-all:
    desc: Install all agent terminal multiplexers
    summary: |
      Installs every agent multiplexer in this section into user-owned
      locations (no sudo): herdr and luvus. Both launchers land in
      ~/.local/bin, so make sure that directory is on your PATH.
      Sequential execution keeps the output readable.
    cmds:
      - task: ':herdr:install'
      - task: ':luvus:install'
    silent: true
